name: SEO Daily Monitor

on:
  schedule:
    # 每天北京时间 09:00 执行（UTC 01:00）
    - cron: '0 1 * * *'
  workflow_dispatch: # 支持手动触发

jobs:
  seo-check:
    runs-on: ubuntu-latest
    steps:
      - name: Run SEO Monitor
        id: monitor
        run: |
          SITE="https://www.skillxm.cn"
          ALERT_COUNT=0
          REPORT=""

          # 检查1: 首页 hreflang（预期3个唯一值）
          HOME_HTML=$(curl -s "$SITE/")
          HREFLANG_HOME=$(echo "$HOME_HTML" | grep -o 'hrefLang="[^"]*"' | sort -u | wc -l)
          HREFLANG_VALUES=$(echo "$HOME_HTML" | grep -o 'hrefLang="[^"]*"' | sort -u | tr '\n' ' ')
          if [ "$HREFLANG_HOME" = "3" ]; then
            REPORT+="✅ 检查1 首页hreflang: ${HREFLANG_VALUES}\n"
          else
            REPORT+="❌ 检查1 首页hreflang异常: 预期3, 实际${HREFLANG_HOME} (${HREFLANG_VALUES})\n"
            ALERT_COUNT=$((ALERT_COUNT + 1))
          fi

          # 检查2: 博客文章页 hreflang（预期2个唯一值）
          BLOG_URL=$(curl -s "$SITE/sitemap.xml" | grep -o 'https://www.skillxm.cn/blog/[^<]*</loc>' | grep -v 'blog/</loc>' | head -1 | sed 's/<\/loc>//')
          BLOG_HTML=$(curl -s "$BLOG_URL")
          HREFLANG_BLOG=$(echo "$BLOG_HTML" | grep -o 'hrefLang="[^"]*"' | sort -u | wc -l)
          if [ "$HREFLANG_BLOG" = "2" ]; then
            REPORT+="✅ 检查2 博客页hreflang: ${HREFLANG_BLOG}个\n"
          else
            REPORT+="❌ 检查2 博客页hreflang异常: 预期2, 实际${HREFLANG_BLOG}\n"
            ALERT_COUNT=$((ALERT_COUNT + 1))
          fi

          # 检查3: 英文页面 html lang 属性
          EN_LANG=$(curl -s "$SITE/en/" | grep -o '<html lang="[^"]*"' | head -1)
          if echo "$EN_LANG" | grep -q 'lang="en"'; then
            REPORT+="✅ 检查3 英文页lang: ${EN_LANG}\n"
          else
            REPORT+="❌ 检查3 英文页lang异常: ${EN_LANG}\n"
            ALERT_COUNT=$((ALERT_COUNT + 1))
          fi

          # 检查4: 多个英文页面 lang 属性
          EN_PAGES=("/en/" "/en/tools/" "/en/blog/" "/en/tools/pinyin-converter/" "/en/tools/stroke-order/" "/en/tools/hsk-flashcards/" "/en/blog/how-to-start-learning-chinese-from-zero/")
          EN_FAIL=0
          for page in "${EN_PAGES[@]}"; do
            lang=$(curl -s "$SITE$page" | grep -o '<html lang="[^"]*"' | head -1)
            if ! echo "$lang" | grep -q 'lang="en"'; then
              REPORT+="❌ 检查4 ${page} lang异常: ${lang}\n"
              EN_FAIL=$((EN_FAIL + 1))
            fi
          done
          if [ "$EN_FAIL" = "0" ]; then
            REPORT+="✅ 检查4 英文页面lang全部正常(7页)\n"
          else
            ALERT_COUNT=$((ALERT_COUNT + 1))
          fi

          # 检查5: example.com 残留
          EMAIL_BAD=$(echo "$HOME_HTML" | grep -c 'example.com')
          if [ "$EMAIL_BAD" = "0" ]; then
            REPORT+="✅ 检查5 无example.com残留\n"
          else
            REPORT+="❌ 检查5 发现${EMAIL_BAD}处example.com残留\n"
            ALERT_COUNT=$((ALERT_COUNT + 1))
          fi

          # 检查6: canonical URL
          CANONICAL=$(echo "$HOME_HTML" | grep -o 'rel="canonical" href="[^"]*"' | head -1)
          if echo "$CANONICAL" | grep -q 'skillxm.cn'; then
            REPORT+="✅ 检查6 Canonical: ${CANONICAL}\n"
          else
            REPORT+="❌ 检查6 Canonical异常: ${CANONICAL}\n"
            ALERT_COUNT=$((ALERT_COUNT + 1))
          fi

          # 检查7: sitemap.xml
          SITEMAP_XML=$(curl -s "$SITE/sitemap.xml")
          SITEMAP_COUNT=$(echo "$SITEMAP_XML" | grep -c '<loc>')
          SITEMAP_STATUS=$(curl -sI "$SITE/sitemap.xml" | grep -o 'HTTP/[^ ]* [0-9]*' | head -1)
          if [ "$SITEMAP_COUNT" -gt 100 ] && echo "$SITEMAP_STATUS" | grep -q '200'; then
            REPORT+="✅ 检查7 Sitemap: ${SITEMAP_COUNT}个URL, ${SITEMAP_STATUS}\n"
          else
            REPORT+="❌ 检查7 Sitemap异常: ${SITEMAP_STATUS}, ${SITEMAP_COUNT}个URL\n"
            ALERT_COUNT=$((ALERT_COUNT + 1))
          fi

          # 检查8: robots.txt
          ROBOTS_STATUS=$(curl -sI "$SITE/robots.txt" | grep -o 'HTTP/[^ ]* [0-9]*' | head -1)
          if echo "$ROBOTS_STATUS" | grep -q '200'; then
            REPORT+="✅ 检查8 robots.txt: ${ROBOTS_STATUS}\n"
          else
            REPORT+="❌ 检查8 robots.txt异常: ${ROBOTS_STATUS}\n"
            ALERT_COUNT=$((ALERT_COUNT + 1))
          fi

          # 检查9: HTTP安全头
          HEADERS=$(curl -sI "$SITE/")
          HSTS=$(echo "$HEADERS" | grep -ic 'strict-transport-security')
          XFRAME=$(echo "$HEADERS" | grep -ic 'x-frame-options')
          XCTO=$(echo "$HEADERS" | grep -ic 'x-content-type-options')
          if [ "$HSTS" -ge 1 ] && [ "$XFRAME" -ge 1 ] && [ "$XCTO" -ge 1 ]; then
            REPORT+="✅ 检查9 安全头: HSTS/XFO/XCTO 全部存在\n"
          else
            REPORT+="⚠️ 检查9 安全头缺失: HSTS=${HSTS} XFO=${XFRAME} XCTO=${XCTO}\n"
          fi

          # 检查10: 关键页面状态码
          KEY_PAGES=("/" "/blog/" "/tools/" "/en/" "/grade/" "/textbook/" "/knowledge/" "/parent-guide/" "/about/" "/contact/")
          PAGE_FAIL=0
          for page in "${KEY_PAGES[@]}"; do
            status=$(curl -sI "$SITE$page" | grep -o 'HTTP/[^ ]* [0-9]*' | head -1 | grep -o '[0-9]*$')
            if [ "$status" != "200" ]; then
              REPORT+="❌ 检查10 ${page} → ${status}\n"
              PAGE_FAIL=$((PAGE_FAIL + 1))
            fi
          done
          if [ "$PAGE_FAIL" = "0" ]; then
            REPORT+="✅ 检查10 关键页面全部200(10页)\n"
          else
            ALERT_COUNT=$((ALERT_COUNT + 1))
          fi

          # 检查11: sitemap URL 随机抽样
          SITEMAP_URLS=$(echo "$SITEMAP_XML" | grep -o 'https://www.skillxm.cn[^<]*</loc>' | sed 's/<\/loc>//' | shuf | head -5)
          SITEMAP_FAIL=0
          for url in $SITEMAP_URLS; do
            status=$(curl -sI "$url" | grep -o 'HTTP/[^ ]* [0-9]*' | head -1 | grep -o '[0-9]*$')
            if [ "$status" != "200" ]; then
              REPORT+="❌ 检查11 Sitemap URL异常: ${url} → ${status}\n"
              SITEMAP_FAIL=$((SITEMAP_FAIL + 1))
            fi
          done
          if [ "$SITEMAP_FAIL" = "0" ]; then
            REPORT+="✅ 检查11 Sitemap抽样5个URL全部200\n"
          else
            ALERT_COUNT=$((ALERT_COUNT + 1))
          fi

          echo "alert_count=$ALERT_COUNT" >> $GITHUB_OUTPUT
          echo "report<<EOF" >> $GITHUB_OUTPUT
          echo -e "$REPORT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Issue on Failure
        if: steps.monitor.outputs.alert_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const report = `${{ steps.monitor.outputs.report }}`;
            const alertCount = `${{ steps.monitor.outputs.alert_count }}`;
            const date = new Date().toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' });
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 SEO 监控告警 - ${date} (${alertCount}个异常)`,
              body: `## SEO 监控报告\n\n执行时间: ${date}\n异常数量: ${alertCount}\n\n### 检查结果\n\n${report}\n\n---\n> 此监控任务运行至 2026-08-12，届时可删除 \`.github/workflows/seo-monitor.yml\` 停止监控。\n> 请立即检查 [www.skillxm.cn](https://www.skillxm.cn) 的 SEO 状态。`,
              labels: ['seo-monitor', 'alert']
            });

      - name: Close Old Issues on Success
        if: steps.monitor.outputs.alert_count == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'seo-monitor',
              state: 'open'
            });
            for (const issue of issues.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: '✅ SEO 检查已恢复正常，自动关闭此 Issue。'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }
